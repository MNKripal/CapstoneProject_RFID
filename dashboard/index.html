<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFID Scan Log</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    color-scheme: light;
    --surface-0: #f5f5f3;      /* page */
    --surface-1: #fcfcfb;      /* cards, chart surface */
    --border:    #e2e1dc;
    --grid:      #ebeae6;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #86847e;
    --series-1: #2a78d6;       /* single series: scans */
    --series-1-soft: #cde2fb;
    --good:     #0ca30c;
    --critical: #d03b3b;
    --good-bg:     #e6f6e6;
    --critical-bg: #fbe9e9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0: #111110;
      --surface-1: #1a1a19;
      --border:    #2e2e2b;
      --grid:      #2a2a27;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #8f8e86;
      --series-1: #3987e5;
      --series-1-soft: #1c5cab;
      --good-bg:     #143a14;
      --critical-bg: #3e1a1a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--surface-0); color: var(--text-primary);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 20px 24px 40px;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .sub { color: var(--text-secondary); }
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 13px; }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
  .live.stale::before { background: var(--text-muted); }

  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .filters label { color: var(--text-secondary); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  select, button {
    font: inherit; color: var(--text-primary); background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--text-muted); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .k { color: var(--text-secondary); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .tile .v { font-size: 28px; font-weight: 650; line-height: 1.2; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .d { color: var(--text-muted); font-size: 12px; margin-top: 2px; }

  .row { display: grid; grid-template-columns: 3fr 2fr; gap: 12px; margin-bottom: 16px; }
  @media (max-width: 900px) { .row { grid-template-columns: 1fr; } }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0 0 10px; }
  .card h2 span { color: var(--text-muted); font-weight: 400; }
  #map { height: 360px; border-radius: 8px; background: var(--surface-0); }
  .leaflet-container { font: inherit; }
  .leaflet-popup-content { margin: 10px 12px; font-size: 13px; }
  .leaflet-popup-content b { display: block; margin-bottom: 2px; }

  svg.chart { width: 100%; height: 300px; display: block; overflow: visible; }
  svg.chart text { fill: var(--text-secondary); font-size: 11px; }
  svg.chart .grid line { stroke: var(--grid); stroke-width: 1; }
  svg.chart .axis line { stroke: var(--border); }
  svg.chart .bar { fill: var(--series-1); }
  svg.chart .hit { fill: transparent; }
  svg.chart .hit:hover + .bar, svg.chart g.on .bar { fill: var(--series-1-soft); }
  .tip {
    position: fixed; pointer-events: none; z-index: 2000; display: none;
    background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }
  .tip b { font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--text-secondary); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  tbody tr:hover { background: var(--surface-0); }
  td.uid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  td.loc { color: var(--text-secondary); }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; }
  .badge.ok  { background: var(--good-bg);     color: var(--good); }
  .badge.no  { background: var(--critical-bg); color: var(--critical); }
  .table-wrap { overflow-x: auto; }
  .empty { color: var(--text-muted); padding: 24px; text-align: center; }
  .unknown { color: var(--critical); }
</style>
</head>
<body>
<header>
  <div>
    <h1>RFID Scan Log</h1>
    <div class="sub">Tag reads from fixed reader stations on the ASU Tempe campus</div>
  </div>
  <div class="live" id="live">connecting…</div>
</header>

<div class="filters">
  <label>Range
    <select id="range">
      <option value="today">Today</option>
      <option value="24h" selected>Last 24 hours</option>
      <option value="7d">Last 7 days</option>
      <option value="all">All time</option>
    </select>
  </label>
  <label>Reader <select id="reader"><option value="">All readers</option></select></label>
  <label>Status
    <select id="status">
      <option value="">All</option>
      <option value="1">Authorized</option>
      <option value="0">Denied</option>
    </select>
  </label>
  <button id="reset" type="button">Reset</button>
</div>

<div class="tiles">
  <div class="tile"><div class="k">Scans</div><div class="v" id="t-scans">–</div><div class="d" id="t-scans-d"></div></div>
  <div class="tile"><div class="k">Authorized</div><div class="v" id="t-ok">–</div><div class="d" id="t-ok-d"></div></div>
  <div class="tile"><div class="k">Denied</div><div class="v" id="t-no">–</div><div class="d" id="t-no-d"></div></div>
  <div class="tile"><div class="k">Unique tags</div><div class="v" id="t-tags">–</div><div class="d" id="t-tags-d"></div></div>
</div>

<div class="row">
  <div class="card">
    <h2>Reader locations <span id="map-sub"></span></h2>
    <div id="map"></div>
  </div>
  <div class="card">
    <h2>Scans over time <span id="chart-sub"></span></h2>
    <svg class="chart" id="chart" role="img" aria-label="Scans per time bucket"></svg>
  </div>
</div>

<div class="card">
  <h2>Scan history <span id="table-sub"></span></h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Time</th><th>Tag UID</th><th>Reader</th><th>Location</th><th>Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No scans in this range yet. Present a tag to a reader.</div>
  </div>
</div>

<div class="tip" id="tip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const CAMPUS = [33.4187, -111.9347];
  const POLL_MS = 4000;

  let readers = {};       // id -> {id,name,lat,lon}
  let scans = [];         // newest first, from server
  let markers = {};       // id -> L.circleMarker
  let map;

  // ---------- filters ----------
  function rangeStart() {
    const now = new Date();
    switch ($('range').value) {
      case 'today': { const d = new Date(now); d.setHours(0, 0, 0, 0); return d; }
      case '24h': return new Date(now - 24 * 3600e3);
      case '7d':  return new Date(now - 7 * 24 * 3600e3);
      default:    return null;
    }
  }
  function filtered() {
    const start = rangeStart();
    const rid = $('reader').value;
    const st = $('status').value;
    return scans.filter(s =>
      (!start || new Date(s.ts) >= start) &&
      (!rid || s.reader_id === rid) &&
      (!st || String(s.authorized ? 1 : 0) === st));
  }

  // ---------- map ----------
  function initMap() {
    map = L.map('map', { scrollWheelZoom: false }).setView(CAMPUS, 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    for (const r of Object.values(readers)) {
      const m = L.circleMarker([r.lat, r.lon], {
        radius: 9, color: '#fcfcfb', weight: 2, fillColor: '#2a78d6', fillOpacity: 0.95
      }).addTo(map);
      m.bindPopup('');
      m.on('click', () => { $('reader').value = r.id; render(); });
      markers[r.id] = m;
    }
  }
  function renderMap(rows) {
    const counts = {};
    for (const s of rows) counts[s.reader_id] = (counts[s.reader_id] || 0) + 1;
    const max = Math.max(1, ...Object.values(counts));
    const sel = $('reader').value;
    for (const [id, m] of Object.entries(markers)) {
      const c = counts[id] || 0;
      const r = readers[id];
      m.setStyle({ radius: 7 + 9 * Math.sqrt(c / max), fillOpacity: sel && sel !== id ? 0.35 : 0.95 });
      m.setPopupContent(`<b>${r.name}</b>${id}<br>${c} scan${c === 1 ? '' : 's'} in range`);
      m.bindTooltip(`${r.name}: ${c}`, { direction: 'top', offset: [0, -8] });
    }
    $('map-sub').textContent = `· ${Object.keys(readers).length} readers`;
  }

  // ---------- chart ----------
  function buckets(rows) {
    const range = $('range').value;
    const now = new Date();
    let start, stepMs, fmt, n;
    if (range === 'today' || range === '24h') {
      stepMs = 3600e3;
      start = range === 'today' ? rangeStart() : new Date(Math.floor((now - 23 * 3600e3) / stepMs) * stepMs);
      n = range === 'today' ? now.getHours() + 1 : 24;
      fmt = d => d.toLocaleTimeString([], { hour: 'numeric' });
    } else {
      stepMs = 24 * 3600e3;
      let first = new Date(now); first.setHours(0, 0, 0, 0);
      if (range === '7d') { first = new Date(first - 6 * stepMs); n = 7; }
      else {
        const oldest = rows.length ? new Date(rows[rows.length - 1].ts) : first;
        const days = Math.min(30, Math.max(1, Math.ceil((first - oldest) / stepMs) + 1));
        first = new Date(first - (days - 1) * stepMs); n = days;
      }
      start = first;
      fmt = d => d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }
    const b = Array.from({ length: n }, (_, i) => ({ t: new Date(start.getTime() + i * stepMs), v: 0, label: '' }));
    for (const x of b) x.label = fmt(x.t);
    for (const s of rows) {
      const i = Math.floor((new Date(s.ts) - start) / stepMs);
      if (i >= 0 && i < n) b[i].v++;
    }
    return { b, unit: stepMs === 3600e3 ? 'hour' : 'day' };
  }
  function renderChart(rows) {
    const { b, unit } = buckets(rows);
    const svg = $('chart');
    const W = svg.clientWidth || 400, H = 300, P = { t: 12, r: 8, b: 28, l: 34 };
    const iw = W - P.l - P.r, ih = H - P.t - P.b;
    const max = Math.max(1, ...b.map(x => x.v));
    const ticks = niceTicks(max);
    const y = v => P.t + ih - (v / ticks[ticks.length - 1]) * ih;
    const gap = 2, bw = Math.max(2, iw / b.length - gap);
    let g = `<g class="grid">` + ticks.map(t => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}"/>` +
      `<text x="${P.l - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join('') + `</g>`;
    g += `<g class="axis"><line x1="${P.l}" x2="${W - P.r}" y1="${P.t + ih}" y2="${P.t + ih}"/></g>`;
    const every = Math.ceil(b.length / (iw / 48));
    b.forEach((x, i) => {
      const bx = P.l + i * (iw / b.length) + gap / 2, by = y(x.v), h = P.t + ih - by;
      const label = `${x.label}${unit === 'hour' ? '' : ''}`;
      g += `<g data-i="${i}">
        <rect class="hit" x="${bx - gap / 2}" y="${P.t}" width="${bw + gap}" height="${ih}"/>
        <rect class="bar" x="${bx}" y="${by}" width="${bw}" height="${Math.max(h, x.v ? 2 : 0)}" rx="4" ry="4"/>
        ${h > 4 ? `<rect class="bar" x="${bx}" y="${P.t + ih - 4}" width="${bw}" height="4"/>` : ''}
        ${i % every === 0 ? `<text x="${bx + bw / 2}" y="${H - 8}" text-anchor="middle">${label}</text>` : ''}
      </g>`;
    });
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = g;
    $('chart-sub').textContent = `· per ${unit}`;
    // hover tooltip
    const tip = $('tip');
    svg.querySelectorAll('g[data-i]').forEach(el => {
      const x = b[+el.dataset.i];
      el.addEventListener('mousemove', e => {
        tip.style.display = 'block';
        tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY - 28) + 'px';
        const when = unit === 'hour'
          ? x.t.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric' })
          : x.t.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
        tip.innerHTML = `${when}<br><b>${x.v}</b> scan${x.v === 1 ? '' : 's'}`;
      });
      el.addEventListener('mouseleave', () => tip.style.display = 'none');
    });
  }
  function niceTicks(max) {
    const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 5, 10].map(m => m * mag).find(s => s >= raw) || mag;
    const top = Math.ceil(max / step) * step;
    const t = []; for (let v = 0; v <= top; v += step) t.push(v);
    return t;
  }

  // ---------- table + tiles ----------
  function fmtTime(ts) {
    const d = new Date(ts);
    return d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', second: '2-digit' });
  }
  function renderTable(rows) {
    const body = $('rows');
    const shown = rows.slice(0, 500);
    body.innerHTML = shown.map(s => {
      const r = readers[s.reader_id];
      const loc = r ? r.name : `<span class="unknown">unknown reader</span>`;
      return `<tr>
        <td>${fmtTime(s.ts)}</td>
        <td class="uid">${s.uid.replace(/(..)(?=.)/g, '$1 ')}</td>
        <td>${s.reader_id}</td>
        <td class="loc">${loc}</td>
        <td>${s.authorized
          ? '<span class="badge ok">✓ Authorized</span>'
          : '<span class="badge no">✕ Denied</span>'}</td>
      </tr>`;
    }).join('');
    $('empty').hidden = rows.length > 0;
    $('table-sub').textContent = rows.length > 500 ? `· showing 500 of ${rows.length}` : `· ${rows.length}`;
  }
  function renderTiles(rows) {
    const ok = rows.filter(s => s.authorized).length;
    const tags = new Set(rows.map(s => s.uid));
    const rangeName = $('range').options[$('range').selectedIndex].text.toLowerCase();
    $('t-scans').textContent = rows.length; $('t-scans-d').textContent = rangeName;
    $('t-ok').textContent = ok; $('t-ok-d').textContent = rows.length ? Math.round(100 * ok / rows.length) + '% of scans' : '';
    $('t-no').textContent = rows.length - ok; $('t-no-d').textContent = rows.length ? Math.round(100 * (rows.length - ok) / rows.length) + '% of scans' : '';
    $('t-tags').textContent = tags.size; $('t-tags-d').textContent = 'distinct UIDs';
  }

  function render() {
    const rows = filtered();
    renderTiles(rows); renderMap(rows); renderChart(rows); renderTable(rows);
  }

  // ---------- data ----------
  async function loadReaders() {
    const res = await fetch('/api/readers'); const j = await res.json();
    readers = Object.fromEntries(j.readers.map(r => [r.id, r]));
    const sel = $('reader');
    for (const r of j.readers) { const o = document.createElement('option'); o.value = r.id; o.textContent = `${r.name} (${r.id})`; sel.appendChild(o); }
  }
  let lastCount = -1;
  async function poll() {
    try {
      const res = await fetch('/api/scans?limit=5000'); const j = await res.json();
      scans = j.scans;
      $('live').textContent = `live · ${new Date().toLocaleTimeString()}`;
      $('live').classList.remove('stale');
      if (scans.length !== lastCount) { lastCount = scans.length; render(); }
    } catch (e) {
      $('live').textContent = 'server unreachable'; $('live').classList.add('stale');
    }
  }

  ['range', 'reader', 'status'].forEach(id => $(id).addEventListener('change', render));
  $('reset').addEventListener('click', () => { $('range').value = '24h'; $('reader').value = ''; $('status').value = ''; render(); });
  window.addEventListener('resize', () => renderChart(filtered()));

  loadReaders().then(() => { initMap(); return poll(); }).then(() => setInterval(poll, POLL_MS));
})();
</script>
</body>
</html>
